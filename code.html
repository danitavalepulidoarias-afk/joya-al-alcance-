<style>
        body {
            background-color: #FAFAFA;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .luxury-shadow {
            shadow: 0px 4px 20px rgba(0,0,0,0.04);
        }
        .transition-soft {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Custom focused input underline effect */
        .input-focus-gold:focus-within .input-line {
            width: 100%;
        }

<body class="flex min-h-screen items-center justify-center p-margin-mobile md:p-0">
<!-- Login Container -->
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-12 animate-fade-in text-center">
<img alt="Al Alcance de un Clic Logo" class="h-32 w-auto object-contain mx-auto transition-transform hover:scale-105 duration-500" src="https://lh3.googleusercontent.com/aida/AP1WRLvPLg2zX82wTQ8qZh0RV_Ewpcl7u5shvl7LoA4LGGMlULAJRNOL-YcDiFnMigpL2ZRrILSEnp8jiSmlaaB6Z3UxpAqFV8pfC8GqH4CgTpJcFmn8ui1qzks1OibgQQ-cH5iTCDaSA5UigdxXQMDDOAUH894kbZd3ebGshsUWOUUQMCAQfSzk6mIHY-vriEEBVltTTw4mpIdIw6UPHu9XpXuyFyy8-QfXZDq3U7l1bPpr5J1IzGiQeaBZw-3p"/>
<div class="mt-4 opacity-60">
<span class="font-label-md text-label-md tracking-[0.2em] text-secondary uppercase">Luxury Jewelry Management</span>
</div>
</div>
<!-- Welcome Message -->
<div class="mb-10 text-center">
<h1 class="font-headline-md text-headline-md text-on-background mb-2">Bienvenido de nuevo</h1>
<p class="font-body-md text-body-md text-secondary">Ingrese sus credenciales para continuar</p>
</div>
<!-- Form Section -->
<form class="w-full space-y-6" onsubmit="return false;">
<!-- Email Input -->
<div class="group relative flex flex-col">
<label class="font-label-md text-label-md text-on-surface-variant mb-2 ml-1" for="email">Email / Usuario</label>
<div class="relative bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] transition-soft hover:shadow-md border border-transparent group-focus-within:border-primary-container/30">
<div class="flex items-center px-4">
<span class="material-symbols-outlined text-secondary mr-3 text-[20px]">mail</span>
<input class="w-full py-4 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant/60" id="email" placeholder="nombre@boutique.com" type="email"/>
</div>
</div>
</div>
<!-- Password Input -->
<div class="group relative flex flex-col">
<div class="flex justify-between items-end mb-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="password">Contraseña</label>
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] transition-soft hover:shadow-md border border-transparent group-focus-within:border-primary-container/30">
<div class="flex items-center px-4">
<span class="material-symbols-outlined text-secondary mr-3 text-[20px]">lock</span>
<input class="w-full py-4 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant/60" id="password" placeholder="••••••••" type="password"/>
<button class="material-symbols-outlined text-outline-variant hover:text-secondary" type="button">visibility_off</button>
</div>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary-container text-on-secondary py-5 rounded-xl font-body-md text-body-md font-semibold shadow-lg shadow-primary-container/20 transition-all duration-300 hover:bg-[#C2A032] hover:-translate-y-0.5 active:scale-95">
                Iniciar Sesión
            </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-10 gap-4">
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
<span class="font-label-md text-label-md text-outline-variant">O accede vía</span>
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
</div>
<!-- Biometric Options -->
<div class="flex justify-center gap-6">
<button class="flex flex-col items-center group">
<div class="w-16 h-16 rounded-full bg-surface-container-lowest shadow-[0px_4px_20px_rgba(0,0,0,0.04)] flex items-center justify-center transition-all duration-300 group-hover:shadow-md group-hover:border-primary-container/20 border border-transparent">
<span class="material-symbols-outlined text-primary text-[32px]">drafts</span>
</div>
<span class="mt-3 font-label-sm text-label-sm text-secondary group-hover:text-primary">FaceID</span>
</button>
<button class="flex flex-col items-center group">
<div class="w-16 h-16 rounded-full bg-surface-container-lowest shadow-[0px_4px_20px_rgba(0,0,0,0.04)] flex items-center justify-center transition-all duration-300 group-hover:shadow-md group-hover:border-primary-container/20 border border-transparent">
<span class="material-symbols-outlined text-primary text-[32px]">fingerprint</span>
</div>
<span class="mt-3 font-label-sm text-label-sm text-secondary group-hover:text-primary">TouchID</span>
</button>
</div>
<!-- Footer Note -->
<footer class="mt-16 text-center">
<p class="font-label-sm text-label-sm text-outline-variant tracking-wider">EST. 2024 • PREMIUM ACCESS ONLY</p>
</footer>
</main>
<!-- Subtle Background Decoration -->
<div class="fixed top-0 right-0 w-1/3 h-full pointer-events-none opacity-[0.03] overflow-hidden hidden lg:block">
<span class="material-symbols-outlined text-[600px] -mr-48 mt-12 text-primary" style="font-variation-settings: 'wght' 100;">diamond</span>
</div>
<script>
        // Micro-interactions
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.relative').style.boxShadow = '0px 12px 30px rgba(212, 175, 55, 0.1)';
            });
            input.addEventListener('blur', () => {
                input.closest('.relative').style.boxShadow = '0px 4px 20px rgba(0,0,0,0.04)';
            });
        });

        // Toggle Password Visibility
        const togglePass = document.querySelector('button.material-symbols-outlined');
        const passInput = document.getElementById('password');
        togglePass.addEventListener('click', () => {
            const isPass = passInput.getAttribute('type') === 'password';
            passInput.setAttribute('type', isPass ? 'text' : 'password');
            togglePass.textContent = isPass ? 'visibility' : 'visibility_off';
            togglePass.classList.toggle('text-primary');
        });
    </script>
</body></html>
