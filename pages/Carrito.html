}

width:100%;

}

<script>

let metodoSeleccionado = "";

// seleccionar método
function seleccionar(tipo, elemento){

metodoSeleccionado = tipo;

// quitar selección
document.querySelectorAll(".metodo").forEach(m=>{
m.classList.remove("activo");
});

// activar seleccionado
elemento.classList.add("activo");

// ocultar formularios
document.querySelectorAll(".form").forEach(f=>{
f.style.display="none";
});

// mostrar formulario correcto
document.getElementById(tipo).style.display="block";
}

// pagar
function pagar(){

if(metodoSeleccionado===""){
alert("Selecciona un método de pago ⚠️");
return;
}

let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

if(carrito.length===0){
alert("Carrito vacío ❌");
return;
}

// generar número de pedido
let numero = Math.floor(Math.random()*100000);

// crear pedido
let pedido = {
producto: carrito[0],
estado: 0,
metodo: metodoSeleccionado
};

// guardar pedido
localStorage.setItem(numero, JSON.stringify(pedido));

// guardar historial
let historial = JSON.parse(localStorage.getItem("historial")) || [];
historial.push(numero);
localStorage.setItem("historial", JSON.stringify(historial));

// limpiar carrito
localStorage.removeItem("carrito");

// mensaje bonito
alert("✅ Pago exitoso con " + metodoSeleccionado.toUpperCase() +
"\nNúmero de pedido: " + numero);

// redirigir
window.location.href = "seguimiento.html?pedido=" + numero;

}

</script>
