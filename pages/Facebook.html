<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook Login</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}
body{
background:#f0f2f5;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}
.login-facebook{
width:400px;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 20px #ccc;
text-align:center;
}
.logo-facebook{
margin-bottom:20px;
}
.logo-facebook img{
width:70px;
}
h1{
font-size:28px;
margin-bottom:10px;
color:#1877f2;
}
p{
color:#555;
margin-bottom:20px;
}
input{
width:100%;
padding:15px;
margin:8px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}
.btn-facebook{
width:100%;
background:#1877f2;
color:white;
padding:14px;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}
.btn-facebook:hover{
background:#0d65d9;
}
.olvide{
display:block;
margin:20px 0;
color:#1877f2;
text-decoration:none;
}
.linea{
height:1px;
background:#ddd;
margin:20px 0;
}
.crear{
background:#42b72a;
color:white;
padding:13px 20px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
display:inline-block;
}
.crear:hover{
background:#36a420;
}
</style>
</head>
<body>
<div class="login-facebook">
<div class="logo-facebook">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png">
</div>
<h1>
Facebook
</h1>
<p>
Inicia sesión para continuar
</p>
<form>
<input 
type="text"
placeholder="Correo electrónico o teléfono">
<input 
type="password"
placeholder="Contraseña">
<button class="btn-facebook">
Iniciar sesión
</button>
<a class="olvide" href="#">
¿Olvidaste tu contraseña?
</a>
<div class="linea"></div>
<a class="crear" href="#">
Crear cuenta nueva
</a>
</form>
</div>
</body>
</html>
