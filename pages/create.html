<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Crear Pedido</title>
<body>
<div class="navbar">
<div>💎 Joya al alcance de un clic</div>

<div>
<a href="inicio.html">🏠 Inicio</a>
<a href="catalogo.html">💎 Catálogo</a>
<a href="crear.html">🛒 Crear pedido</a>
<a href="carrito.html">🛍️ Carrito</a>
<a href="seguimiento.html">📦 Seguimiento</a>
<a href="login.html">👤 Login</a>
</div>
<style>
body{
margin:0;
font-family:Arial;
background:#0d0d0d;
color:white;
}

.header{
background:black;
color:gold;
padding:15px;
text-align:center;
font-size:20px;
border-bottom:1px solid gold;
}

.container{
padding:20px;
}

.productos{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.card{
background:#1a1a1a;
border-radius:15px;
padding:15px;
text-align:center;
cursor:pointer;
transition:0.3s;
border:1px solid transparent;
}

.card:hover{
transform:scale(1.05);
border:1px solid gold;
}

.card img{
width:100%;
border-radius:10px;
margin-bottom:10px;
}

.nombre{
color:gold;
font-weight:bold;
}

.seleccionado{
border:2px solid gold;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:gold;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.resultado{
margin-top:20px;
background:#111;
padding:15px;
border-radius:10px;
display:none;
}
</style>
</head>

<body>

<div class="header">💎 Crear Pedido</div>

<div class="container">

<h3>Selecciona tu joya</h3>

<div class="productos" id="productos"></div>

<button onclick="crearPedido()">🛒 Crear Pedido</button>

<div class="resultado" id="resultado"></div>

</div>

<script>

let productos = [
{nombre:"Anillo de lujo", img:"https://images.unsplash.com/photo-1602751584552-8ba73aad10e1"},
{nombre:"Collar elegante", img:"https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f"},
{nombre:"Pulsera moderna", img:"https://images.unsplash.com/photo-1617038220319-276d3cfab638"}
];

let seleccionado = null;

// mostrar productos
let html = "";
productos.forEach((p, i)=>{
html += `
<div class="card" onclick="seleccionar(${i}, this)">
<img src="${p.img}">
<div class="nombre">${p.nombre}</div>
</div>
`;
});

document.getElementById("productos").innerHTML = html;

// seleccionar
function seleccionar(i, elemento){
seleccionado = productos[i];

document.querySelectorAll(".card").forEach(c=>{
c.classList.remove("seleccionado");
});

elemento.classList.add("seleccionado");
}

// crear pedido
function crearPedido(){

if(!seleccionado){
alert("Selecciona un producto ⚠️");
return;
}

let numero = Math.floor(Math.random()*100000);

let pedido = {
producto: seleccionado,
estado: 0
};

// guardar pedido
localStorage.setItem(numero, JSON.stringify(pedido));

// guardar historial
let historial = JSON.parse(localStorage.getItem("historial")) || [];
historial.push(numero);
localStorage.setItem("historial", JSON.stringify(historial));

// mostrar resultado
let resultado = document.getElementById("resultado");
resultado.style.display = "block";
resultado.innerHTML = `
<h3>✅ Pedido creado</h3>
<p>Número: <b>${numero}</b></p>
<p>Producto: ${seleccionado.nombre}</p>
<button onclick="irSeguimiento(${numero})">🔎 Ver seguimiento</button>
`;

}

// ir a seguimiento
function irSeguimiento(num){
window.location.href = "seguimiento.html?pedido=" + num;
}

</script>

</body>
</html>
