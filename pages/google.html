<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Joya al alcance de un clic</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}
body{
    background:#f2f2f2;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.login{
    width:380px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    text-align:center;

}
.logo{
    font-size:35px;
    margin-bottom:15px;
}
.login h1{
    margin-bottom:10px;
    color:#111;
}
.login p{
    color:#666;
    margin-bottom:25px;
}
.form-group{
    text-align:left;
    margin-bottom:15px;
}
label{
    font-weight:bold;
    color:#222;
}
input{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
}
input:focus{
    border-color:#000;
}
.btn-login{
    width:100%;
    padding:13px;
    margin-top:15px;
    background:#000;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}
.btn-login:hover{
    background:#333;
}
.divisor{
    display:flex;
    align-items:center;
    gap:10px;
    margin:25px 0;
    color:#777;
}
.divisor span{
    flex:1;
    height:1px;
    background:#ddd;
}
.facebook{
    width:100%;
    padding:13px;
    background:#1877f2;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    transition:.3s;
}
.facebook:hover{
    background:#0d5dcc;
}
.registro{
    margin-top:25px;
}
.registro a{
    color:#000;
    font-weight:bold;
    text-decoration:none;
}
.registro a:hover{
    text-decoration:underline;
}
.terminos{

    font-size:12px;
    color:#888;
    margin-top:20px;

}
</style>
</head>
<body>
<div class="login">
<div class="logo">
<div class="logo">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" 
    alt="Google">
</div>
</div>
<h1>
Iniciar sesión
</h1>
<p>
Ingresa a tu cuenta
</p>
<form>
<div class="form-group">
<label>
Correo electrónico
</label>
<input 
type="email"
placeholder="correo@gmail.com"
required>
</div>
<div class="form-group">
<label>
Contraseña
</label>
<input 
type="password"
placeholder="********"
required>
</div>
<button class="btn-login">
Iniciar sesión
</button>
<div class="divisor">
<span></span>
o
<span></span>
</div>
<button type="button" class="facebook">
Continuar con Facebook
</button>
<div class="registro">
<p>
¿No tienes cuenta?
<a href="#">
Registrarse
</a>
</p>
</div>
<div class="terminos">
Al continuar aceptas los términos y condiciones
</div>
</form>
</div>
</body>
</html>
