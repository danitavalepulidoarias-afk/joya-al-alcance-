<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La joya al alcance de un clic</title>
  <link rel="stylesheet" href="../style/login.css">

  
    
 

</head>

<body>

  <!-- NAVBAR -->

  <div class="navbar">

    <div class="logo">
      💎 La joya al alcance de un clic
    </div>

    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="./pages/Catalogo.html">Catálogo</a>
      <a href="./pages/login.html">Login</a>
    </div>

  </div>

  <!-- LOGIN -->

  <div class="container">

    <div class="login-container">

      <img class="logo-img"
      src="https://static.vecteezy.com/system/resources/previews/019/879/186/non_2x/user-icon-on-transparent-background-free-png.png">

      <h2>Iniciar sesión</h2>

      <form>

        <!-- EMAIL -->

        <div class="input-group">

          <label>Correo electrónico</label>

          <div class="input-box">

            <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png">

            <input type="email" placeholder="Ingresa tu correo">

          </div>

        </div>

        <!-- PASSWORD -->

        <div class="input-group">

          <label>Contraseña</label>

          <div class="input-box">

            <img src="https://cdn-icons-png.flaticon.com/512/3064/3064155.png">

            <input type="password" placeholder="Ingresa tu contraseña">

          </div>

        </div>

        <!-- BOTON -->

        <button class="btn" type="submit">
          Iniciar sesión
        </button>

        <a href="#" class="forgot">
          ¿Olvidaste tu contraseña?
        </a>

        <!-- REDES -->

        <p class="social-text">
          O inicia sesión con:
        </p>

        <button class="btn social-btn">
          <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">
          Google
        </button>

        <button class="btn social-btn">
          <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png">
          Facebook
        </button>

      </form>

    </div>

  </div>

</body>
